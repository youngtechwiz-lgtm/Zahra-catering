kind = "web"
previewPath = "/"
title = "ZAHRA Catering Service"
description = "A premium multi-page catering website for ZAHRA with public service discovery, menu and gallery browsing, event showcases, booking enquiries, and a separate admin content dashboard."
version = "1.0.0"
id = "artifacts/zahra-catering"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24525

[services.development]
run = "pnpm --filter @workspace/zahra-catering run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zahra-catering", "run", "build" ]
serve = "static"
publicDir = "artifacts/zahra-catering/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24525"
BASE_PATH = "/"
